name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Installed-artifact self-test
        run: python -m heresy_sec selftest
      - name: Architecture audit
        run: python scripts/audit_architecture.py
      - name: Network audit
        run: python scripts/audit_network.py
      - name: Deterministic zipapp
        run: |
          python scripts/build_zipapp.py
          cp dist/heresy_sec.pyz /tmp/heresy_sec-first.pyz
          python scripts/build_zipapp.py
          cmp /tmp/heresy_sec-first.pyz dist/heresy_sec.pyz
          python scripts/verify_size.py dist/heresy_sec.pyz
          python dist/heresy_sec.pyz selftest

